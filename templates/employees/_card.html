<a href="{% url 'employees:employee_detail' employee.pk %}" class="employee-card">
    {% if employee.main_image %}
        <img
            src="{{ employee.main_image.image.url }}"
            alt="{{ employee.full_name }}"
            class="card-image"
        >
    {% else %}
        <div class="card-image-placeholder">👤</div>
    {% endif %}

    <div class="employee-name">{{ employee.full_name }}</div>

    <div class="employee-skills">
        {% for skill_level in employee.skill_levels.all %}
            <span class="skill-tag">{{ skill_level.skill.name }}</span>
        {% empty %}
            <span style="color:#64748b;">Нет навыков</span>
        {% endfor %}
    </div>

    <div class="employee-experience">
        📅 Стаж: {{ employee.experience_days }} дн.
    </div>
</a>
